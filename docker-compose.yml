services:
    frontend:
        build: ./frontend
    landing:
        build: ./landing
    backend:
        build: ./backend
    db:
        image: postgres:18.6-alpine3.24
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-app}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
            POSTGRES_DB: ${POSTGRES_DB:-verve}
    nginx:
        image: nginx:1.31.6-alpine
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./nginx:/etc/nginx/certs:ro

volumes:
    nginx-data:
        driver: nginx
