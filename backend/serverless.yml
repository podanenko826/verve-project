org: podanenko826
app: verve
service: verve-backend

provider:
    name: aws
    runtime: nodejs22.x
    region: eu-west-1
    memorySize: 512
    environment:
        NODE_ENV: production
        DATABASE_URL: ${env:DATABASE_URL, ''}
        AUTH0_AUDIENCE: ${env:AUTH0_AUDIENCE, ''}
        AUTH0_ISSUER_BASE_URL: ${env:AUTH0_ISSUER_BASE_URL, ''}

build:
    esbuild:
        bundle: true
        minify: true
        external:
            - '@prisma/client'

package:
    patterns:
        - '!node_modules/**'
        - 'node_modules/.prisma/**'
        - 'node_modules/@prisma/client/**'
        - '!node_modules/.prisma/client/libquery_engine-darwin-*'
        - '!node_modules/.prisma/client/libquery_engine-debian-*'
        - '!node_modules/.prisma/client/libquery_engine-rhel-openssl-1.0.x*'
        - '.env'

functions:
    api:
        handler: app.handler
        events:
            - http:
                  path: /
                  method: ANY
                  cors: true
            - http:
                  path: /{proxy+}
                  method: ANY
                  cors: true
