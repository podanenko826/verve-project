name: Deploy on Production

on:
    push:
        branches:
            - main

# prevent concurrent deploys from conflicting
concurrency:
    group: production-deploy
    cancel-in-progress: false

jobs:
    # backend
    deploy-backend:
        name: Deploy Backend
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"
                  cache-dependency-path: backend/package-lock.json

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
                  aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
                  aws-region: ${{secrets.AWS_REGION}}

            - name: Install and Deploy Backend
              working-directory: ./backend
              env:
                  DATABASE_URL: ${{secrets.DATABASE_URL}}
                  AUTH0_AUDIENCE: ${{secrets.AUTH0_AUDIENCE}}
                  AUTH0_ISSUER_BASE_URL: ${{secrets.AUTH0_ISSUER_BASE_URL}}
                  SERVERLESS_ACCESS_KEY: ${{secrets.SERVERLESS_ACCESS_KEY}}
              run: |
                  npm ci
                  npx prisma generate
                  npx serverless deploy --stage dev

    # frontend
    deploy-frontend:
        name: Deploy Frontend
        runs-on: ubuntu-latest
        needs: deploy-backend
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
                  aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
                  aws-region: ${{secrets.AWS_REGION}}

            - name: Install and Build Frontend
              working-directory: ./frontend
              env:
                  VITE_API_URL: ${{ secrets.VITE_API_URL }}
                  VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN }}
                  VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
                  VITE_AUTH0_AUDIENCE: ${{ secrets.VITE_AUTH0_AUDIENCE }}
              run: |
                  npm install --legacy-peer-deps
                  npm run build

            - name: Sync to S3 and Invalidate CloudFront
              working-directory: ./frontend
              run: |
                  aws s3 sync dist/ s3://${{ secrets.S3_FRONTEND_BUCKET }} --delete
                  aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_FRONTEND_ID }} --paths "/*"

    # landing
    deploy-landing:
        name: Deploy Landing
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"
                  cache-dependency-path: landing/package-lock.json

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
                  aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
                  aws-region: ${{secrets.AWS_REGION}}

            - name: Install and Build Landing
              working-directory: ./landing
              run: |
                  npm ci
                  npm run build

            - name: Sync to S3 and Invalidate CloudFront
              working-directory: ./landing
              run: |
                  aws s3 sync dist/ s3://${{ secrets.S3_LANDING_BUCKET }} --delete
                  aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_LANDING_ID }} --paths "/*"
